name: Build macOS (unsigned)

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  build_macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get version
        id: get_version
        run: |
          VERSION=$(sed -n "s/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p" app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
      - name: Dependencies
        working-directory: app
        run: flutter pub get
      - name: Build macOS app
        working-directory: app
        run: flutter build macos
      - name: Archive macOS app
        working-directory: app/build/macos/Build/Products/Release
        run: zip -r Locara-macOS-unsigned.zip *.app
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-unsigned
          path: app/build/macos/Build/Products/Release/Locara-macOS-unsigned.zip






