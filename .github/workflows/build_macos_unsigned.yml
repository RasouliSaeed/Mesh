name: Build macOS (unsigned)

on:
  workflow_dispatch:
  workflow_call:

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build_macos_dmg:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Setup Rust toolchain
        run: |
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build macOS app (Universal)
        working-directory: app
        run: flutter build macos -v

      - name: Create DMG (Universal)
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          APP_PATH=$(find app/build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -n 1)
          codesign --force --deep --sign - "$APP_PATH" || true
          hdiutil create -volname "Mesh" -srcfolder "$APP_PATH" -ov -format UDZO "Mesh-${VERSION}-macOS-universal.dmg"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-universal-result
          path: Mesh-*-macOS-universal.dmg
          if-no-files-found: error
