name: Build windows zip

on:
  workflow_dispatch:
  workflow_call:

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build_windows_zip:
    needs: build
    runs-on: windows-latest
    environment: packaging
    permissions:
      id-token: write # OIDC token for Azure login
      contents: read

    steps:
      - name: Fix long file paths
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"

      # Required by the CMake install step (app/windows/CMakeLists.txt installs Mesh_msix_helper.msix)
      - name: Build MSIX helper
        run: |
          $makepri = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\makepri.exe' | Select-Object -Last 1
          & $makepri.FullName new /pr support\build\msix\content /cf support\build\msix\priconfig.xml /mn support\build\msix\content\AppxManifest.xml /of support\build\msix\content\resources.pri /o
          & 'C:\Program Files (x86)\Windows Kits\10\App Certification Kit\makeappx.exe' pack /o /d support\build\msix\content /nv /p app\windows\Mesh_msix_helper.msix

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Compile for Windows
        working-directory: app
        run: flutter build windows
      - name: Add DLL files
        working-directory: app
        run: |
          Copy-Item ../support/build/windows/x64/msvcp140.dll build/windows/x64/runner/Release/
          Copy-Item ../support/build/windows/x64/vcruntime140.dll build/windows/x64/runner/Release/
          Copy-Item ../support/build/windows/x64/vcruntime140_1.dll build/windows/x64/runner/Release/

      # The MSIX helper only makes sense for the installer; portable users should not register an MSIX package
      - name: Remove MSIX helper from portable bundle
        working-directory: app
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue build/windows/x64/runner/Release/*msix_helper*
          Remove-Item -Force -ErrorAction SilentlyContinue build/windows/x64/runner/Release/*manifest
          Remove-Item -Force -ErrorAction SilentlyContinue build/windows/x64/runner/Release/install_msix_helper.ps1

      - name: Sign portable binary
        working-directory: app
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Mesh, O=Mesh Team" -CertStoreLocation "Cert:\CurrentUser\My" -HashAlgorithm SHA256 -NotAfter (Get-Date).AddYears(10)
          $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\x64\signtool.exe' | Select-Object -Last 1).FullName
          echo "Signing mesh_app.exe with certificate $($cert.Thumbprint)"
          & $signtool sign /sha1 $cert.Thumbprint /fd SHA256 /d "Mesh" "build\windows\x64\runner\Release\mesh_app.exe"

      - name: Zip compiled files
        working-directory: app
        run: Get-ChildItem -Path build/windows/x64/runner/Release -Exclude *.pdb | Compress-Archive -DestinationPath "Mesh-${{ needs.build.outputs.version }}-windows-x86-64.zip"

      - name: Upload signed zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip-x86-64-result
          path: app/Mesh-${{ needs.build.outputs.version }}-windows-x86-64.zip
          if-no-files-found: error


















