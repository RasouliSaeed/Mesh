name: Build windows arm64 zip

on:
  workflow_dispatch:
  workflow_call:

# Windows ARM64 requires 3.47+
env:
  FLUTTER_VERSION: "3.47.4"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build_windows_zip_arm_64:
    needs: build
    runs-on: windows-11-arm
    environment: packaging
    permissions:
      id-token: write # OIDC token for Azure login
      contents: read

    steps:
      - name: Fix long file paths
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4

      # Flutter doesn't provide Windows ARM64 binaries, so clone the SDK from GitHub instead of using a setup action.
      - name: Setup Flutter SDK
        run: |
          git clone --depth 1 --branch ${{ env.FLUTTER_VERSION }} https://github.com/flutter/flutter.git $env:USERPROFILE\flutter
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\flutter\bin"
          & "$env:USERPROFILE\flutter\bin\flutter.bat" --version

      # Flutter silently falls back to an x64 Dart SDK when arm64 artifacts are missing, which would produce an x64 build
      - name: Verify native arm64 toolchain
        run: |
          $dartVersion = & "$env:USERPROFILE\flutter\bin\dart.bat" --version 2>&1 | Out-String
          Write-Host $dartVersion
          if ($dartVersion -notmatch 'windows_arm64') {
            Write-Error "Dart SDK is not windows_arm64 - Flutter fell back to x64"
            exit 1
          }

      # Required by the CMake install step (app/windows/CMakeLists.txt installs Locara_msix_helper.msix).
      # The checked-in manifest declares x64; patch it so the package identity matches the arm64 executable.
      - name: Build MSIX helper
        run: |
          $manifest = 'support\build\msix\content\AppxManifest.xml'
          (Get-Content $manifest) -replace 'ProcessorArchitecture="x64"', 'ProcessorArchitecture="arm64"' | Set-Content $manifest
          if (-not (Select-String -Path $manifest -Pattern 'ProcessorArchitecture="arm64"' -Quiet)) {
            Write-Error "Failed to patch ProcessorArchitecture in $manifest"
            exit 1
          }
          $makepri = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\10.*\arm64\makepri.exe' | Select-Object -Last 1
          & $makepri.FullName new /pr support\build\msix\content /cf support\build\msix\priconfig.xml /mn support\build\msix\content\AppxManifest.xml /of support\build\msix\content\resources.pri /o
          & "$($makepri.Directory.FullName)\makeappx.exe" pack /o /d support\build\msix\content /nv /p app\windows\Locara_msix_helper.msix

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Compile for Windows
        working-directory: app
        run: flutter build windows
      - name: Add DLL files
        working-directory: app
        continue-on-error: true
        run: |
          try {
            $crt = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\2022\*\VC\Redist\MSVC\*\arm64\Microsoft.VC143.CRT' -ErrorAction Stop | Select-Object -Last 1
            if ($crt) {
              Copy-Item "$($crt.FullName)\msvcp140.dll" build/windows/arm64/runner/Release/
              Copy-Item "$($crt.FullName)\vcruntime140.dll" build/windows/arm64/runner/Release/
              Copy-Item "$($crt.FullName)\vcruntime140_1.dll" build/windows/arm64/runner/Release/
            }
          } catch {
            Write-Warning "Could not copy ARM64 VC++ Redist DLLs"
          }

      # The MSIX helper only makes sense for the installer; portable users should not register an MSIX package
      - name: Remove MSIX helper from portable bundle
        working-directory: app
        run: |
          Remove-Item build/windows/arm64/runner/Release/Locara_msix_helper.msix
          Remove-Item build/windows/arm64/runner/Release/install_msix_helper.ps1
          Remove-Item build/windows/arm64/runner/Release/Locara_app.exe.manifest

      - name: Zip compiled files
        working-directory: app
        run: Get-ChildItem -Path build/windows/arm64/runner/Release -Exclude *.pdb | Compress-Archive -DestinationPath "Locara-${{ needs.build.outputs.version }}-windows-arm-64.zip"

      - name: Upload signed zip
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip-arm-64-result
          path: app/Locara-${{ needs.build.outputs.version }}-windows-arm-64.zip
          if-no-files-found: error
















