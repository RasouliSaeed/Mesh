name: Release Draft

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      # Android
      build_android_apk:
        description: 'Android: APK (Universal, ARMv8, ARMv7, x64)'
        required: true
        type: boolean
        default: true

      # Windows
      build_windows_setup:
        description: 'Windows: Setup x64 (Inno Setup Installer)'
        required: true
        type: boolean
        default: true
      build_windows_portable:
        description: 'Windows: Portable x64 (Zip)'
        required: true
        type: boolean
        default: true

      # macOS
      build_macos_dmg:
        description: 'macOS: DMG Universal (Intel & Apple Silicon)'
        required: true
        type: boolean
        default: false

      # Linux
      build_linux_app_amd64:
        description: 'Linux: App amd64 (AppImage)'
        required: true
        type: boolean
        default: false
      build_linux_app_arm64:
        description: 'Linux: App ARM64 (AppImage)'
        required: true
        type: boolean
        default: false
      build_linux_core_amd64:
        description: 'Linux: Core amd64 (CLI)'
        required: true
        type: boolean
        default: false
      build_linux_core_arm64:
        description: 'Linux: Core ARM64 (CLI)'
        required: true
        type: boolean
        default: false

jobs:
  # Android: Builds Universal, ARMv8, ARMv7, and x64 APKs
  build_apk:
    if: ${{ github.event_name == 'push' || github.event.inputs.build_android_apk == 'true' }}
    uses: ./.github/workflows/build_android_apk.yml
    secrets: inherit

  # Windows: Setup x64
  build_windows_setup:
    if: ${{ github.event_name == 'push' || github.event.inputs.build_windows_setup == 'true' }}
    uses: ./.github/workflows/build_windows_exe_unsigned.yml
    secrets: inherit
    permissions:
      id-token: write
      contents: read

  # Windows: Portable x64
  build_windows_portable:
    if: ${{ github.event_name == 'push' || github.event.inputs.build_windows_portable == 'true' }}
    uses: ./.github/workflows/build_windows_zip_x64.yml
    secrets: inherit
    permissions:
      id-token: write
      contents: read

  # macOS: DMG Universal
  build_macos_dmg:
    if: ${{ github.event.inputs.build_macos_dmg == 'true' }}
    uses: ./.github/workflows/build_macos_unsigned.yml

  # Linux: App amd64 (AppImage)
  build_linux_app_amd64:
    if: ${{ github.event.inputs.build_linux_app_amd64 == 'true' }}
    uses: ./.github/workflows/build_linux_appimage_x64.yml

  # Linux: App ARM64 (AppImage)
  build_linux_app_arm64:
    if: ${{ github.event.inputs.build_linux_app_arm64 == 'true' }}
    uses: ./.github/workflows/build_linux_appimage_arm64.yml

  # Linux: Core amd64 & ARM64 (CLI)
  build_linux_core:
    if: ${{ github.event.inputs.build_linux_core_amd64 == 'true' || github.event.inputs.build_linux_core_arm64 == 'true' }}
    uses: ./.github/workflows/build_linux_cli.yml

  release:
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs:
      - build_apk
      - build_windows_setup
      - build_windows_portable
      - build_macos_dmg
      - build_linux_app_amd64
      - build_linux_app_arm64
      - build_linux_core
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v4

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Draft release
        id: draft_release
        uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: v${{ steps.get_version.outputs.version }}
          name: v${{ steps.get_version.outputs.version }}

      # ==============================
      # Download Build Artifacts
      # ==============================
      - name: Download APK artifacts
        if: ${{ github.event_name == 'push' || github.event.inputs.build_android_apk == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: apk-result
          path: apk-result

      - name: Download Windows Setup x64
        if: ${{ github.event_name == 'push' || github.event.inputs.build_windows_setup == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: windows-exe-x86-64-unsigned
          path: windows-exe-x86-64-unsigned

      - name: Download Windows Portable x64
        if: ${{ github.event_name == 'push' || github.event.inputs.build_windows_portable == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: windows-zip-x86-64-result
          path: windows-zip-x86-64-result

      - name: Download macOS DMG Universal
        if: ${{ github.event.inputs.build_macos_dmg == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: macos-dmg-universal-result
          path: macos-dmg-universal-result

      - name: Download Linux App amd64 (AppImage)
        if: ${{ github.event.inputs.build_linux_app_amd64 == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: appimage-x86-64-result
          path: appimage-x86-64-result

      - name: Download Linux App ARM64 (AppImage)
        if: ${{ github.event.inputs.build_linux_app_arm64 == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: appimage-arm-64-result
          path: appimage-arm-64-result

      - name: Download Linux Core amd64
        if: ${{ github.event.inputs.build_linux_core_amd64 == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: cli-linux-x86-64-result
          path: cli-linux-x86-64-result

      - name: Download Linux Core ARM64
        if: ${{ github.event.inputs.build_linux_core_arm64 == 'true' }}
        uses: actions/download-artifact@v8
        with:
          name: cli-linux-arm-64-result
          path: cli-linux-arm-64-result

      # ==============================
      # Stage & Standardize Release Asset Names
      # ==============================
      - name: Stage Release Assets
        run: |
          mkdir -p release_assets
          # Android APKs
          if [ -d "apk-result" ]; then
            [ -f "apk-result/app-universal-release.apk" ] && cp apk-result/app-universal-release.apk release_assets/Mesh-${{ steps.get_version.outputs.version }}-android-universal.apk
            [ -f "apk-result/app-arm64-v8a-release.apk" ] && cp apk-result/app-arm64-v8a-release.apk release_assets/Mesh-${{ steps.get_version.outputs.version }}-android-arm64v8.apk
            [ -f "apk-result/app-armeabi-v7a-release.apk" ] && cp apk-result/app-armeabi-v7a-release.apk release_assets/Mesh-${{ steps.get_version.outputs.version }}-android-arm32v7.apk
            [ -f "apk-result/app-x86_64-release.apk" ] && cp apk-result/app-x86_64-release.apk release_assets/Mesh-${{ steps.get_version.outputs.version }}-android-x64.apk
          fi
          # Windows
          if [ -d "windows-exe-x86-64-unsigned" ]; then
            for f in windows-exe-x86-64-unsigned/*.exe; do
              [ -f "$f" ] && cp "$f" release_assets/Mesh-${{ steps.get_version.outputs.version }}-windows-x86-64.exe
            done
          fi
          if [ -d "windows-zip-x86-64-result" ]; then
            for f in windows-zip-x86-64-result/*.zip; do
              [ -f "$f" ] && cp "$f" release_assets/Mesh-${{ steps.get_version.outputs.version }}-windows-x86-64.zip
            done
          fi
          # macOS
          if [ -d "macos-dmg-universal-result" ]; then
            for f in macos-dmg-universal-result/*.dmg; do
              [ -f "$f" ] && cp "$f" release_assets/Mesh-${{ steps.get_version.outputs.version }}-macOS-universal.dmg
            done
          fi
          # Linux AppImage
          if [ -d "appimage-x86-64-result" ]; then
            for f in appimage-x86-64-result/*; do
              if [[ $f == *.AppImage && $f != *.AppImage.zsync ]]; then
                cp "$f" release_assets/Mesh-${{ steps.get_version.outputs.version }}-linux-x86-64.AppImage
              fi
            done
          fi
          if [ -d "appimage-arm-64-result" ]; then
            for f in appimage-arm-64-result/*; do
              if [[ $f == *.AppImage && $f != *.AppImage.zsync ]]; then
                cp "$f" release_assets/Mesh-${{ steps.get_version.outputs.version }}-linux-arm-64.AppImage
              fi
            done
          fi
          # Linux CLI
          if [ -d "cli-linux-x86-64-result" ]; then
            for f in cli-linux-x86-64-result/*.tar.gz; do
              [ -f "$f" ] && cp "$f" release_assets/Mesh-CLI-${{ steps.get_version.outputs.version }}-linux-x86-64.tar.gz
            done
          fi
          if [ -d "cli-linux-arm-64-result" ]; then
            for f in cli-linux-arm-64-result/*.tar.gz; do
              [ -f "$f" ] && cp "$f" release_assets/Mesh-CLI-${{ steps.get_version.outputs.version }}-linux-arm-64.tar.gz
            done
          fi
          echo "=== Staged Release Assets ==="
          ls -la release_assets/

      # ==============================
      # Upload Assets to GitHub Release
      # ==============================
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          files: release_assets/*
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
