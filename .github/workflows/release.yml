name: Release Draft

on:
  workflow_dispatch:
    inputs:
      # Android
      build_android_apk:
        description: 'Android: APK (Universal, ARMv8, ARMv7, x64)'
        required: true
        type: boolean
        default: true

      # Windows
      build_windows_setup:
        description: 'Windows: Setup x64 (Inno Setup Installer)'
        required: true
        type: boolean
        default: true
      build_windows_portable:
        description: 'Windows: Portable x64 (Zip)'
        required: true
        type: boolean
        default: true

      # macOS
      build_macos_dmg:
        description: 'macOS: DMG Universal (Intel & Apple Silicon)'
        required: true
        type: boolean
        default: false

      # Linux
      build_linux_app_amd64:
        description: 'Linux: App amd64 (AppImage)'
        required: true
        type: boolean
        default: false
      build_linux_app_arm64:
        description: 'Linux: App ARM64 (AppImage)'
        required: true
        type: boolean
        default: false
      build_linux_core_amd64:
        description: 'Linux: Core amd64 (CLI)'
        required: true
        type: boolean
        default: false
      build_linux_core_arm64:
        description: 'Linux: Core ARM64 (CLI)'
        required: true
        type: boolean
        default: false

jobs:
  # Android: Builds Universal, ARMv8, ARMv7, and x64 APKs
  build_apk:
    if: ${{ github.event.inputs.build_android_apk == 'true' }}
    uses: ./.github/workflows/build_android_apk.yml
    secrets: inherit

  # Windows: Setup x64
  build_windows_setup:
    if: ${{ github.event.inputs.build_windows_setup == 'true' }}
    uses: ./.github/workflows/build_windows_exe_unsigned.yml
    secrets: inherit
    permissions:
      id-token: write
      contents: read

  # Windows: Portable x64
  build_windows_portable:
    if: ${{ github.event.inputs.build_windows_portable == 'true' }}
    uses: ./.github/workflows/build_windows_zip_x64.yml
    secrets: inherit
    permissions:
      id-token: write
      contents: read

  # macOS: DMG Universal
  build_macos_dmg:
    if: ${{ github.event.inputs.build_macos_dmg == 'true' }}
    uses: ./.github/workflows/build_macos_unsigned.yml

  # Linux: App amd64 (AppImage)
  build_linux_app_amd64:
    if: ${{ github.event.inputs.build_linux_app_amd64 == 'true' }}
    uses: ./.github/workflows/build_linux_appimage_x64.yml

  # Linux: App ARM64 (AppImage)
  build_linux_app_arm64:
    if: ${{ github.event.inputs.build_linux_app_arm64 == 'true' }}
    uses: ./.github/workflows/build_linux_appimage_arm64.yml

  # Linux: Core amd64 & ARM64 (CLI)
  build_linux_core:
    if: ${{ github.event.inputs.build_linux_core_amd64 == 'true' || github.event.inputs.build_linux_core_arm64 == 'true' }}
    uses: ./.github/workflows/build_linux_cli.yml

  release:
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    needs:
      - build_apk
      - build_windows_setup
      - build_windows_portable
      - build_macos_dmg
      - build_linux_app_amd64
      - build_linux_app_arm64
      - build_linux_core
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v7

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Draft release
        id: draft_release
        uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: v${{ steps.get_version.outputs.version }}
          name: v${{ steps.get_version.outputs.version }}

      # ==============================
      # Android APKs
      # ==============================
      - name: Download APK artifacts
        if: ${{ github.event.inputs.build_android_apk == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: apk-result
          path: apk-result

      - name: Copy APK files to root
        if: ${{ github.event.inputs.build_android_apk == 'true' }}
        run: cp apk-result/*.apk .

      - name: Upload Release Asset - APK Universal
        if: ${{ github.event.inputs.build_android_apk == 'true' }}
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.draft_release.outputs.upload_url }}
          asset_path: app-universal-release.apk
          asset_name: Mesh-${{ steps.get_version.outputs.version }}-android-universal.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Upload Release Asset - APK ARMv8
        if: ${{ github.event.inputs.build_android_apk == 'true' }}
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.draft_release.outputs.upload_url }}
          asset_path: app-arm64-v8a-release.apk
          asset_name: Mesh-${{ steps.get_version.outputs.version }}-android-arm64v8.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Upload Release Asset - APK ARMv7
        if: ${{ github.event.inputs.build_android_apk == 'true' }}
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.draft_release.outputs.upload_url }}
          asset_path: app-armeabi-v7a-release.apk
          asset_name: Mesh-${{ steps.get_version.outputs.version }}-android-arm32v7.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Upload Release Asset - APK x64
        if: ${{ github.event.inputs.build_android_apk == 'true' }}
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.draft_release.outputs.upload_url }}
          asset_path: app-x86_64-release.apk
          asset_name: Mesh-${{ steps.get_version.outputs.version }}-android-x64.apk
          asset_content_type: application/vnd.android.package-archive

      # ==============================
      # Windows
      # ==============================
      - name: Download Windows Setup x64
        if: ${{ github.event.inputs.build_windows_setup == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: windows-exe-x86-64-unsigned
          path: windows-exe-x86-64-unsigned

      - name: Copy Windows Setup exe to root
        if: ${{ github.event.inputs.build_windows_setup == 'true' }}
        run: cp windows-exe-x86-64-unsigned/*.exe result-windows-setup.exe

      - name: Upload Release Asset - Windows Setup x64
        if: ${{ github.event.inputs.build_windows_setup == 'true' }}
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.draft_release.outputs.upload_url }}
          asset_path: result-windows-setup.exe
          asset_name: Mesh-${{ steps.get_version.outputs.version }}-windows-x86-64.exe
          asset_content_type: application/vnd.microsoft.portable-executable

      - name: Download Windows Portable x64
        if: ${{ github.event.inputs.build_windows_portable == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: windows-zip-x86-64-result
          path: windows-zip-x86-64-result

      - name: Copy Windows Portable zip to root
        if: ${{ github.event.inputs.build_windows_portable == 'true' }}
        run: cp windows-zip-x86-64-result/*.zip result-windows-portable.zip

      - name: Upload Release Asset - Windows Portable x64
        if: ${{ github.event.inputs.build_windows_portable == 'true' }}
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.draft_release.outputs.upload_url }}
          asset_path: result-windows-portable.zip
          asset_name: Mesh-${{ steps.get_version.outputs.version }}-windows-x86-64.zip
          asset_content_type: application/zip

      # ==============================
      # macOS
      # ==============================
      - name: Download macOS DMG Universal
        if: ${{ github.event.inputs.build_macos_dmg == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg-universal-result
          path: macos-dmg-universal-result

      - name: Copy macOS DMG to root
        if: ${{ github.event.inputs.build_macos_dmg == 'true' }}
        run: cp macos-dmg-universal-result/*.dmg result-macos.dmg

      - name: Upload Release Asset - macOS DMG Universal
        if: ${{ github.event.inputs.build_macos_dmg == 'true' }}
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.draft_release.outputs.upload_url }}
          asset_path: result-macos.dmg
          asset_name: Mesh-${{ steps.get_version.outputs.version }}-macOS-universal.dmg
          asset_content_type: application/x-apple-diskimage

      # ==============================
      # Linux Apps (AppImage)
      # ==============================
      - name: Download Linux App amd64 (AppImage)
        if: ${{ github.event.inputs.build_linux_app_amd64 == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: appimage-x86-64-result
          path: appimage-x86-64-result

      - name: Copy Linux App amd64 to root
        if: ${{ github.event.inputs.build_linux_app_amd64 == 'true' }}
        run: |
          for file in appimage-x86-64-result/*; do
            if [[ $file == *.AppImage && $file != *.AppImage.zsync ]]; then
              cp "$file" result-linux-amd64.AppImage
            fi
          done

      - name: Upload Release Asset - Linux App amd64
        if: ${{ github.event.inputs.build_linux_app_amd64 == 'true' }}
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.draft_release.outputs.upload_url }}
          asset_path: result-linux-amd64.AppImage
          asset_name: Mesh-${{ steps.get_version.outputs.version }}-linux-x86-64.AppImage
          asset_content_type: application/x-appimage

      - name: Download Linux App ARM64 (AppImage)
        if: ${{ github.event.inputs.build_linux_app_arm64 == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: appimage-arm-64-result
          path: appimage-arm-64-result

      - name: Copy Linux App ARM64 to root
        if: ${{ github.event.inputs.build_linux_app_arm64 == 'true' }}
        run: |
          for file in appimage-arm-64-result/*; do
            if [[ $file == *.AppImage && $file != *.AppImage.zsync ]]; then
              cp "$file" result-linux-arm64.AppImage
            fi
          done

      - name: Upload Release Asset - Linux App ARM64
        if: ${{ github.event.inputs.build_linux_app_arm64 == 'true' }}
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.draft_release.outputs.upload_url }}
          asset_path: result-linux-arm64.AppImage
          asset_name: Mesh-${{ steps.get_version.outputs.version }}-linux-arm-64.AppImage
          asset_content_type: application/x-appimage

      # ==============================
      # Linux Core (CLI)
      # ==============================
      - name: Download Linux Core amd64
        if: ${{ github.event.inputs.build_linux_core_amd64 == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: cli-linux-x86-64-result
          path: cli-linux-x86-64-result

      - name: Copy Linux Core amd64 to root
        if: ${{ github.event.inputs.build_linux_core_amd64 == 'true' }}
        run: cp cli-linux-x86-64-result/*.tar.gz result-linux-core-amd64.tar.gz

      - name: Upload Release Asset - Linux Core amd64
        if: ${{ github.event.inputs.build_linux_core_amd64 == 'true' }}
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.draft_release.outputs.upload_url }}
          asset_path: result-linux-core-amd64.tar.gz
          asset_name: Mesh-CLI-${{ steps.get_version.outputs.version }}-linux-x86-64.tar.gz
          asset_content_type: application/gzip

      - name: Download Linux Core ARM64
        if: ${{ github.event.inputs.build_linux_core_arm64 == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: cli-linux-arm-64-result
          path: cli-linux-arm-64-result

      - name: Copy Linux Core ARM64 to root
        if: ${{ github.event.inputs.build_linux_core_arm64 == 'true' }}
        run: cp cli-linux-arm-64-result/*.tar.gz result-linux-core-arm64.tar.gz

      - name: Upload Release Asset - Linux Core ARM64
        if: ${{ github.event.inputs.build_linux_core_arm64 == 'true' }}
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.draft_release.outputs.upload_url }}
          asset_path: result-linux-core-arm64.tar.gz
          asset_name: Mesh-CLI-${{ steps.get_version.outputs.version }}-linux-arm-64.tar.gz
          asset_content_type: application/gzip
