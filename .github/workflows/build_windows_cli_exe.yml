name: Build windows CLI exe

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build_cli_windows_exe:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            suffix: x86-64
            signtool_arch: x64
          - runner: windows-11-arm
            suffix: arm-64
            signtool_arch: arm64
    runs-on: ${{ matrix.runner }}
    environment: packaging
    permissions:
      id-token: write # OIDC token for Azure login
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install # version from rust-toolchain.toml

      - name: Compile CLI
        run: cargo build --release --package locara-cli

      - name: Rename CLI executable
        run: Rename-Item -Path "target\release\locara-cli.exe" -NewName "Locara-CLI-${{ needs.build.outputs.version }}-windows-${{ matrix.suffix }}.exe"

      - name: Upload signed CLI
        uses: actions/upload-artifact@v4
        with:
          name: windows-cli-exe-${{ matrix.suffix }}-result
          path: target\release\Locara-CLI-${{ needs.build.outputs.version }}-windows-${{ matrix.suffix }}.exe
          if-no-files-found: error














