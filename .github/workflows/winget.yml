name: Publish to WinGet
on:
  release:
    types: [released]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish Locara
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: Locara.Locara
          installers-regex: 'Locara-(?!CLI-).*\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
      - name: Publish Locara CLI
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: Locara.Locara.CLI
          installers-regex: 'Locara-CLI-.*\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}


