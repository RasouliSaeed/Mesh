name: Publish to WinGet
on:
  release:
    types: [released]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish Mesh
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: Mesh.Mesh
          installers-regex: 'Mesh-(?!CLI-).*\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
      - name: Publish Mesh CLI
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: Mesh.Mesh.CLI
          installers-regex: 'Mesh-CLI-.*\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}


