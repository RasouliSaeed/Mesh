name: Build Android APK

on:
  workflow_dispatch:
  workflow_call:

env:
  FLUTTER_VERSION: "3.47.5"
  APK_BUILD_DIR: "/tmp/build"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build_apk:
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - name: Remove proprietary dependencies
        run: sh support/scripts/remove_proprietary_dependencies.sh

      - name: Copy files to env.APK_BUILD_DIR
        run: |
          mkdir -p $APK_BUILD_DIR
          cp -r . $APK_BUILD_DIR

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android Platform 36
        run: echo y | sdkmanager "platforms;android-36" || true

      - name: Setup NDK libgcc workaround
        run: |
          find /usr/local/lib/android/sdk/ndk -name "libunwind.a" -execdir sh -c 'printf "!<arch>\n" > libgcc.a' \; 2>/dev/null || true
          find "$ANDROID_HOME" -name "libunwind.a" -execdir sh -c 'printf "!<arch>\n" > libgcc.a' \; 2>/dev/null || true

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Rust
        run: |
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.APK_BUILD_DIR }}
          key: v3-android

      - name: Dependencies
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter pub get

      - name: Build Split APKs (arm64-v8a, armeabi-v7a, x86_64)
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: |
          flutter build apk --split-per-abi --target-platform android-arm,android-arm64,android-x64
          echo "=== Built Split APK files ==="
          ls -la build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/*arm64-v8a*.apk $GITHUB_WORKSPACE/app-arm64-v8a-release.apk
          cp build/app/outputs/flutter-apk/*armeabi-v7a*.apk $GITHUB_WORKSPACE/app-armeabi-v7a-release.apk
          cp build/app/outputs/flutter-apk/*x86_64*.apk $GITHUB_WORKSPACE/app-x86_64-release.apk
          cd android && ./gradlew --stop || true

      - name: Build Universal APK
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: |
          flutter clean
          flutter pub get
          flutter build apk --target-platform android-arm,android-arm64,android-x64
          echo "=== Built Universal APK ==="
          ls -la build/app/outputs/flutter-apk/
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/app-universal-release.apk
          cd android && ./gradlew --stop || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-result
          path: |
            app-universal-release.apk
            app-armeabi-v7a-release.apk
            app-arm64-v8a-release.apk
            app-x86_64-release.apk






















