name: Build iOS (unsigned)

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  build_ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get version
        id: get_version
        run: |
          VERSION=$(sed -n "s/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p" app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
      - name: Dependencies
        working-directory: app
        run: flutter pub get
      - name: Build iOS app (unsigned)
        working-directory: app
        run: flutter build ios --no-codesign
      - name: Archive iOS Runner
        working-directory: app/build/ios/iphoneos
        run: zip -r Locara-iOS-unsigned-app.zip Runner.app
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-unsigned
          path: app/build/ios/iphoneos/Locara-iOS-unsigned-app.zip





